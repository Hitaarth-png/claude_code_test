# City registry — the ONLY per-city configuration.
# Each national dataset is filtered to a city by these codes; everything else
# (metrics, map, prep scripts) is city-agnostic. Add a city by adding a row.
#
#   lad_code      ONS Local Authority District code (used for IoD + boundaries)
#   gias_la_code  DfE/GIAS 3-digit LA number (used to filter the GIAS export)

default_city: wolverhampton

cities:
  wolverhampton: { name: Wolverhampton, lad_code: E08000031, gias_la_code: 336 }
